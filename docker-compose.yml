services:
  postgres:
    image: postgres:16-alpine
    container_name: fueltrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fueltrack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: fueltrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fueltrack-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fueltrack -d fueltrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: fueltrack-app
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://fueltrack:${DB_PASSWORD}@postgres:5432/fueltrack?schema=public"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      PORT: 8081
    networks:
      - fueltrack-net

volumes:
  pgdata:

networks:
  fueltrack-net:
    driver: bridge
